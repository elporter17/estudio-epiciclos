<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Panel Potter Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Panel de control: el día como lista de horarios con su estado, botones para correr y las últimas corridas */
:root{--bg:#f6f3ec;--panel:#fffdf8;--tinta:#191714;--suave:#6c665c;--linea:#e3dccd;--rojo:#d7263d;--ok:#1f8a5b;--warn:#b7791f;--azul:#2f6fb5;
--disp:"Archivo Black",Impact,sans-serif;--txt:"IBM Plex Sans",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141311;--panel:#1d1b18;--tinta:#f1ece2;--suave:#a39c8f;--linea:#34302a;--rojo:#ff5a6e;--ok:#4cc790;--warn:#f0b44c;--azul:#6ea6e8;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tinta);font:15px/1.45 var(--txt)}
.env{max-width:980px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left));display:grid;gap:18px}
h1{font:1.8rem/1.1 var(--disp);margin:0}h1 span{color:var(--rojo)}h2{font:600 1.05rem var(--txt);margin:0 0 10px}
.sub{color:var(--suave);font-size:.85rem}.tarjeta{background:var(--panel);border:1px solid var(--linea);border-radius:14px;padding:16px 18px;min-width:0}
.fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
button,select,input{font:inherit;border-radius:10px;border:1px solid var(--linea);background:var(--panel);color:var(--tinta);padding:8px 12px}
button{cursor:pointer;font-weight:600}button.prim{background:var(--rojo);border-color:var(--rojo);color:#fff}button:disabled{opacity:.5;cursor:wait}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.cifra{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:12px 14px}.cifra b{font:1.8rem var(--disp);display:block}
ul{list-style:none;margin:0;padding:0}li.slot{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--linea)}
li.slot:last-child{border-bottom:0}.hora{font-weight:600;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.hecho{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.en-curso{background:color-mix(in srgb,var(--azul) 16%,transparent);color:var(--azul)}
.pendiente{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.perdido,.fallo{background:color-mix(in srgb,var(--rojo) 14%,transparent);color:var(--rojo)}
.proximo{background:color-mix(in srgb,var(--suave) 14%,transparent);color:var(--suave)}
.acciones{display:flex;gap:6px;align-items:center}a{color:var(--azul)}
#aviso{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tinta);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px)}
.manual{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px}
.manual .fila{border:1px solid var(--linea);border-radius:10px;padding:8px 10px}
@media (max-width:520px){li.slot{grid-template-columns:52px 1fr}li.slot .acciones{grid-column:2}}
</style>
</head>
<body>
<div class="env">
  <header class="fila"><div><h1>Potter Play <span>·</span> panel</h1><div class="sub" id="fecha">Horario en hora de Honduras</div></div>
    <div class="acciones"><button id="refrescar" hidden>Actualizar</button><button id="salir" hidden>Salir</button></div></header>

  <section class="tarjeta" id="login">
    <h2>Entrar</h2>
    <form id="formLogin" class="fila"><label for="clave" class="sub">Contraseña del panel</label>
      <input id="clave" type="password" autocomplete="current-password" required style="flex:1;min-width:180px"><button class="prim" type="submit">Entrar</button></form>
    <p class="sub" id="errLogin"></p>
  </section>

  <div id="app" hidden style="display:grid;gap:18px">
    <section class="cifras">
      <div class="cifra"><b id="nHechas">—</b><span class="sub">hechas hoy</span></div>
      <div class="cifra"><b id="nPend">—</b><span class="sub">pendientes</span></div>
      <div class="cifra"><b id="nProx">—</b><span class="sub">por salir hoy</span></div>
      <div class="cifra"><b id="nPerd">—</b><span class="sub">perdidas</span></div>
    </section>

    <section class="tarjeta"><div class="fila"><h2>Hoy</h2><span class="sub" id="cola"></span></div>
      <p class="sub">El relojero lanza lo pendiente cada 10 minutos, una corrida a la vez. «Correr ahora» lo lanza ya o lo adelanta.</p>
      <ul id="dia"></ul></section>

    <section class="tarjeta"><h2>Correr a mano</h2><div class="manual" id="manual"></div></section>

    <section class="tarjeta"><h2>Últimas corridas</h2><ul id="corridas"></ul></section>
  </div>
</div>
<div id="aviso" hidden></div>
<script>
const $ = (id) => document.getElementById(id);
const FORMATOS = ['auto', 'banderas', 'retos', 'quiz', 'prefieres', 'emojis', 'top10', 'noticias'];
const ESTADO = { hecho: 'Hecho', 'en-curso': 'En curso', pendiente: 'Pendiente', perdido: 'Perdido', proximo: 'Próximo' };
let ocupado = false;

function aviso(txt) { const a = $('aviso'); a.textContent = txt; a.hidden = false; clearTimeout(aviso.t); aviso.t = setTimeout(() => (a.hidden = true), 5000); }
async function api(body) {
  const r = await fetch('/api/panel', body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  const d = await r.json().catch(() => ({ error: 'Respuesta inválida.' }));
  if (r.status === 401 && !body?.accion?.startsWith('entrar')) { mostrarLogin(); throw new Error(d.error); }
  if (!r.ok) throw new Error(d.error || `Error ${r.status}`);
  return d;
}
function mostrarLogin() { $('login').hidden = false; $('app').hidden = true; $('salir').hidden = $('refrescar').hidden = true; }
function el(tag, attrs = {}, ...hijos) { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) k === 'class' ? (e.className = v) : k.includes('-') ? e.setAttribute(k, v) : (e[k] = v); e.append(...hijos); return e; }
const hora = (iso) => new Date(iso).toLocaleTimeString('es-HN', { timeZone: 'America/Tegucigalpa', hour: '2-digit', minute: '2-digit' });

async function correr(workflow, inputs, boton) {
  if (boton) boton.disabled = true;
  try { const d = await api({ accion: 'correr', workflow, inputs }); aviso(d.mensaje); setTimeout(cargar, 4000); }
  catch (e) { aviso(e.message); } finally { if (boton) setTimeout(() => (boton.disabled = false), 4000); }
}

function pintar(d) {
  $('login').hidden = true; $('app').hidden = false; $('salir').hidden = $('refrescar').hidden = false;
  const f = new Date(`${d.fecha}T12:00:00Z`).toLocaleDateString('es-HN', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
  $('fecha').textContent = `${f} · ${String(Math.floor(d.min / 60)).padStart(2, '0')}:${String(d.min % 60).padStart(2, '0')} en Honduras`;
  const c = (e) => d.horario.filter((s) => s.estado === e).length;
  $('nHechas').textContent = c('hecho') + c('en-curso'); $('nPend').textContent = c('pendiente'); $('nProx').textContent = c('proximo'); $('nPerd').textContent = c('perdido');
  const activas = d.corridas.filter((r) => r.estado !== 'completed');
  $('cola').textContent = activas.length ? `${activas.length} corriendo o en cola` : 'Nada corriendo ahora';
  $('dia').replaceChildren(...d.horario.map((s) => {
    const r = s.corrida, fallo = r && r.resultado && r.resultado !== 'success';
    const chip = el('span', { class: `chip ${fallo ? 'fallo' : s.estado}`, textContent: fallo ? `Falló (${r.resultado})` : ESTADO[s.estado] });
    const b = el('button', { textContent: s.estado === 'proximo' ? 'Adelantar' : 'Correr ahora', title: `Lanzar ${s.nombre}` });
    b.onclick = () => correr(s.workflow, s.inputs || {}, b);
    const acc = el('span', { class: 'acciones' }, chip);
    if (r) acc.append(el('a', { href: r.url, target: '_blank', rel: 'noopener', textContent: 'ver' }));
    if (!r || fallo || s.estado === 'proximo') acc.append(b);
    return el('li', { class: 'slot' }, el('span', { class: 'hora', textContent: s.hora }), el('div', {}, el('div', { textContent: s.que }), el('div', { class: 'sub', textContent: s.nombre })), acc);
  }));
  $('corridas').replaceChildren(...d.corridas.map((r) => {
    const est = r.estado !== 'completed' ? ['en-curso', 'En curso'] : r.resultado === 'success' ? ['hecho', 'Bien'] : ['fallo', r.resultado || 'Falló'];
    return el('li', { class: 'slot' }, el('span', { class: 'hora', textContent: hora(r.creada) }),
      el('div', {}, el('div', { textContent: d.workflows[r.workflow] || r.nombre }), el('div', { class: 'sub', textContent: r.evento === 'workflow_dispatch' ? 'Lanzada por el relojero o a mano' : r.evento })),
      el('span', { class: 'acciones' }, el('span', { class: `chip ${est[0]}`, textContent: est[1] }), el('a', { href: r.url, target: '_blank', rel: 'noopener', textContent: 'ver' })));
  }));
  if (!$('manual').childElementCount) {
    for (const [wf, nombre] of Object.entries(d.workflows)) {
      const fila = el('div', { class: 'fila' }, el('span', { textContent: nombre }));
      let sel = null;
      if (wf === 'curiosidades-reels.yml') { sel = el('select', { 'aria-label': 'Formato del Reel' }); sel.id = 'formatoManual'; for (const f of FORMATOS) sel.append(new Option(f === 'auto' ? 'el que toca' : f, f)); fila.append(sel); }
      const b = el('button', { textContent: 'Correr' });
      b.onclick = () => correr(wf, sel ? { formato: sel.value } : {}, b);
      fila.append(b); $('manual').append(fila);
    }
  }
}

async function cargar() {
  if (ocupado) return; ocupado = true;
  try { pintar(await api()); } catch (e) { if (!$('login').hidden) return; aviso(e.message); } finally { ocupado = false; }
}
$('formLogin').onsubmit = async (ev) => {
  ev.preventDefault(); $('errLogin').textContent = '';
  try { await api({ accion: 'entrar', clave: $('clave').value }); $('clave').value = ''; cargar(); }
  catch (e) { $('errLogin').textContent = e.message; }
};
$('salir').onclick = async () => { await api({ accion: 'salir' }).catch(() => {}); mostrarLogin(); };
$('refrescar').onclick = cargar;
cargar(); setInterval(() => { if (!document.hidden && !$('app').hidden) cargar(); }, 60000);
</script>
</body>
</html>

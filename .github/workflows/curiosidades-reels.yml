# Reels de quiz y curiosidades para Facebook e Instagram (scripts/curiosidades-video.mjs, sin IA), de 40 a 59 s.
# 12 al día, publicados como Reel y como historia, sin TikTok ni aviso por correo. Rotan: banderas, 5 retos visuales,
# quiz de 5 preguntas, ¿qué prefieres?, adivina con emojis y top 10 (las banderas, lo que más vistas tiene, 2 de cada
# 10). A las 7:57 y 18:57 salen las noticias del día (las junta noticias.yml).
# Reutiliza daily.yml (estado cifrado: historial para no repetir) y nunca corre a la vez que los demás.
name: Quiz y curiosidades en video a Facebook

on:
  # Horario: lo lanza el relojero (/api/relojero, llamado por cron-job.org cada 10 min) según scripts/lib/horario.mjs.
  # Los «schedule» de GitHub se perdían o llegaban con horas de atraso (2026-11-01).
  workflow_dispatch:
    inputs:
      redes:
        description: Redes (fb,ig,tt,yt); vacío = lo de siempre. Lo pone el plan de cada red (scripts/lib/horario.mjs)
        type: string
        default: ''
      formato:
        description: Qué video (auto = el que toca en la rotación)
        type: choice
        options: [auto, estrella, debate, banderas, retos, quiz, prefieres, emojis, top10, datos5, geo, gtaquiz, noticias]
        default: auto
      tiktok:
        description: También como borrador en TikTok (cuenta para los 5 borradores pendientes)
        type: choice
        options: ['no', 'si']
        default: 'no'
      historia:
        description: Publicar también como historia de la página
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  quiz:
    uses: ./.github/workflows/daily.yml
    with:
      cats: curiosidades-video
      # El formato viaja en «figura»; los horarios de noticias lo fijan, los demás siguen la rotación
      figura: ${{ inputs.formato != 'auto' && inputs.formato || '' }}
      publish: ${{ (inputs.tiktok == 'si' || contains(inputs.redes, 'tt')) && 'draft' || 'none' }}
      facebook: si
      redes: ${{ inputs.redes }}
      historia: ${{ github.event_name != 'workflow_dispatch' || inputs.historia }}
      # El correo con la descripción solo hace falta cuando va a TikTok (allí se pega a mano)
      aviso: ${{ inputs.tiktok == 'si' }}
    secrets: inherit

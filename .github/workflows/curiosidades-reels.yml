# Reels de quiz y curiosidades para Facebook e Instagram (scripts/curiosidades-video.mjs, sin IA), de 40 a 59 s.
# 12 al día, publicados como Reel y como historia, sin TikTok ni aviso por correo. Rotan: banderas, 5 retos visuales,
# quiz de 5 preguntas, ¿qué prefieres?, adivina con emojis y top 10 (las banderas, lo que más vistas tiene, 2 de cada
# 10). A las 7:57 y 18:57 salen las noticias del día (las junta noticias.yml).
# Reutiliza daily.yml (estado cifrado: historial para no repetir) y nunca corre a la vez que los demás.
name: Quiz y curiosidades en video a Facebook

on:
  schedule:
    # Minuto 57, lejos de los otros workflows. En Honduras (UTC-6): noticias a las 7:57 y 18:57
    - cron: '57 0,13 * * *'
    # Y el resto: 9:57, 11:57, 12:57, 13:57, 15:57, 17:57, 19:57, 20:57, 21:57 y 22:57
    - cron: '57 1,2,3,4,15,17,18,19,21,23 * * *'
  workflow_dispatch:
    inputs:
      formato:
        description: Qué video (auto = el que toca en la rotación)
        type: choice
        options: [auto, banderas, retos, quiz, prefieres, emojis, top10, noticias]
        default: auto
      historia:
        description: Publicar también como historia de la página
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  quiz:
    uses: ./.github/workflows/daily.yml
    with:
      cats: curiosidades-video
      # El formato viaja en «figura»; los horarios de noticias lo fijan, los demás siguen la rotación
      figura: ${{ inputs.formato != 'auto' && inputs.formato || (github.event.schedule == '57 0,13 * * *' && 'noticias' || '') }}
      publish: none
      facebook: si
      historia: ${{ github.event_name != 'workflow_dispatch' || inputs.historia }}
      aviso: false
    secrets: inherit

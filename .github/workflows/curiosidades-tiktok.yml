# Imágenes de curiosidades y noticias como foto en borrador de TikTok. 2 al día.
# Ojo: cuentan para el mismo límite de TikTok que los videos (5 borradores pendientes cada 24 h). Con estas 2 fotos,
# 2 nombres y 1 futbolista son 5; las otras corridas de videos van solo a Facebook. Si no publicas los pendientes, la
# corrida termina en LIMIT (la imagen igual queda en el correo).
name: Curiosidades a TikTok

on:
  # Horario: lo lanza el relojero (/api/relojero, llamado por cron-job.org cada 10 min) según scripts/lib/horario.mjs.
  # Los «schedule» de GitHub se perdían o llegaban con horas de atraso (2026-11-01).
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  curiosidades:
    uses: ./.github/workflows/daily.yml
    with:
      cats: curiosidades-tiktok
      publish: none
    secrets: inherit

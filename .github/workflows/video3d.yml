# Videos de datos en 3D (video3d/, Remotion + Three.js, sin IA), uno por día desde la cola de guiones
# (video3d/guiones/cola). El relojero (scripts/lib/horario.mjs) lanza «render» de madrugada (~40-55 min en GitHub,
# sin tarjeta gráfica) y «publicar» al mediodía: Reel en Facebook e Instagram, borrador en TikTok y Short privado en
# YouTube. «prueba» solo renderiza y deja el MP4 en los artefactos de la corrida. Reutiliza daily.yml (estado cifrado,
# voz del narrador y avisos de Telegram: fallos, cortes por tiempo, borradores y cola casi vacía).
name: Video 3D

on:
  workflow_dispatch:
    inputs:
      modo:
        description: render (madrugada) · publicar (mediodía) · prueba (solo renderizar)
        type: choice
        options: ['render', 'publicar', 'prueba']
        default: 'prueba'

permissions:
  contents: read
  issues: write

jobs:
  video3d:
    uses: ./.github/workflows/daily.yml
    with:
      cats: ${{ inputs.modo == 'publicar' && 'video3d-publicar' || 'video3d-render' }}
      publish: draft
      facebook: si
      aviso: false
      prueba: ${{ inputs.modo == 'prueba' }}
    secrets: inherit

# Imágenes de curiosidades («¿Sabías que…?», «¿Verdadero o falso?», «¿Cuál es falso?», retos) y noticias recientes,
# publicadas directo en la página de Facebook (y en Instagram). 4 al día (los Reels llegan mucho más): 2 de cada 3 son retos visuales (número
# duplicado, nombre de N letras, letra escondida, fracción, operación) y una de cada 6 es una noticia, si hay una fresca.
# Reutiliza daily.yml (mismo estado: historial para no repetir) y nunca corre a la vez que los videos.
name: Curiosidades a Facebook

on:
  # Horario: lo lanza el relojero (/api/relojero, llamado por cron-job.org cada 10 min) según scripts/lib/horario.mjs.
  # Los «schedule» de GitHub se perdían o llegaban con horas de atraso (2026-11-01).
  workflow_dispatch:
    inputs:
      redes:
        description: Redes (fb,ig,tt,yt); vacío = lo de siempre. Lo pone el plan de cada red (scripts/lib/horario.mjs)
        type: string
        default: ''
      tipo:
        description: Qué publicar (auto = el carrusel que toque; debate = un reto de debate en una imagen; noticias = noticias en imágenes con resumen; retos o datos)
        type: choice
        options: [auto, debate, noticias, retos, datos]
        default: auto

permissions:
  contents: read
  issues: write

jobs:
  curiosidades:
    uses: ./.github/workflows/daily.yml
    with:
      cats: curiosidades-facebook
      publish: none
      redes: ${{ inputs.redes }}
      figura: ${{ inputs.tipo || 'auto' }}
    secrets: inherit

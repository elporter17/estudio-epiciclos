# Imágenes de curiosidades («¿Sabías que…?», «¿Verdadero o falso?», «¿Cuál es falso?», retos) y noticias recientes,
# publicadas directo en la página de Facebook. 8 al día; una de cada 4 es una noticia (si hay una fresca).
# Reutiliza daily.yml (mismo estado: historial para no repetir) y nunca corre a la vez que los videos.
name: Curiosidades a Facebook

on:
  schedule:
    # En Honduras (UTC-6): 7:07, 9:07, 11:07, 13:07, 15:07, 17:07, 19:07 y 21:07
    - cron: '7 1,3,13,15,17,19,21,23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  curiosidades:
    uses: ./.github/workflows/daily.yml
    with:
      cats: curiosidades-facebook
      publish: none
    secrets: inherit

# Imágenes de curiosidades («¿Sabías que…?», «¿Verdadero o falso?», «¿Cuál es falso?», retos) y noticias recientes,
# publicadas directo en la página de Facebook (y en Instagram). 4 al día (los Reels llegan mucho más): 2 de cada 3 son retos visuales (número
# duplicado, nombre de N letras, letra escondida, fracción, operación) y una de cada 6 es una noticia, si hay una fresca.
# Reutiliza daily.yml (mismo estado: historial para no repetir) y nunca corre a la vez que los videos.
name: Curiosidades a Facebook

on:
  schedule:
    # En Honduras (UTC-6): 8:07, 12:07, 17:07 y 20:07
    - cron: '7 2,14,18,23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  curiosidades:
    uses: ./.github/workflows/daily.yml
    with:
      cats: curiosidades-facebook
      publish: none
    secrets: inherit

# Un video de CirculArte cada 4 horas: elige figura compleja → renderiza en modo suspenso → descripción con plantillas →
# borrador en la bandeja de TikTok (la descripción queda en el resumen de la corrida para pegarla en la app).
# Todo sale del proyecto: sin IA ni APIs de pago.
# Por defecto va en borrador hasta que TikTok audite Direct Post: sin auditoría, publicar directo da
# 403 unaudited_client_can_only_post_to_private_accounts. El usuario quiere pasar a directo y público después
# (cambiar 'draft' por 'direct' en los valores por defecto), sabiendo que las reglas de TikTok no aceptan
# herramientas que suben a las propias cuentas.
# Base de todas las publicaciones: nombres.yml (nombres y parejas con los estilos nuevos), famosos.yml (futbolistas) y
# fisica.yml (pelotas y juegos) lo reutilizan con su propio horario. Este ya no corre solo (las figuras e inventadas
# se dejaron de priorizar el 2026-10-27); se puede lanzar a mano con cualquier tipo de video.
# Secretos necesarios (Settings → Secrets and variables → Actions): ver README, sección «Publicación diaria».
name: Video diario a TikTok

on:
  workflow_dispatch:
    inputs:
      cats:
        description: Qué tipo de video
        type: choice
        options: [dibujos, nombres, famosos, curiosidades-facebook, curiosidades-tiktok, curiosidades-video, youtube-largo, video3d-render, video3d-publicar, idea-render, idea-publicar, comentarios, noticias, gta6, fisica, juegos, pelotas, nuevos]
        default: dibujos
      lang:
        description: Idioma del video y la descripción
        type: choice
        options: [es, en]
        default: es
      publish:
        description: Enviar como borrador, publicar directo (requiere auditoría de Direct Post) o solo generar el video
        type: choice
        options: [draft, direct, none]
        default: draft
      privacy:
        description: Privacidad de la publicación directa
        type: choice
        options: [PUBLIC_TO_EVERYONE, MUTUAL_FOLLOW_FRIENDS, SELF_ONLY]
        default: PUBLIC_TO_EVERYONE
      figura:
        description: Una figura concreta por su id (por ejemplo famoso:kane-balondeoro o nombre:Andrea); vacío = al azar
        type: string
        default: ''
      estilos:
        description: Estilos de nombre permitidos, separados por comas (espejo, mandala, hilos, anillos, costura, clasico) o «nuevos»; vacío = todos
        type: string
        default: ''
      facebook:
        description: Publicar también como Reel en la página de Facebook (necesita los secretos FB_PAGE_ID y FB_PAGE_TOKEN)
        type: choice
        options: [si, no, borrador]
        default: si
      historia:
        description: Publicar también el video como historia de la página de Facebook (hasta 60 s)
        type: boolean
        default: false
      aviso:
        description: Comentar en el issue «Videos para publicar» (te llega por correo con la descripción)
        type: boolean
        default: true
      estado:
        description: Solo consultar en TikTok el estado de subidas anteriores (publish_id separados por espacios, o «ultimos»); no genera video
        type: string
        default: ''
      sonido:
        description: Sonido del video (sin = audio en silencio, para ponerle en TikTok una canción del momento)
        type: choice
        options: [sin, con]
        default: sin
      reseed:
        description: Usar el token del secreto TIKTOK_TOKEN_SEED en vez del guardado (tras volver a conectar la cuenta)
        type: boolean
        default: false
  workflow_call:
    inputs:
      cats: { type: string, default: dibujos }
      lang: { type: string, default: es }
      publish: { type: string, default: draft }
      privacy: { type: string, default: PUBLIC_TO_EVERYONE }
      sonido: { type: string, default: sin }
      figura: { type: string, default: '' }
      estilos: { type: string, default: '' }
      estado: { type: string, default: '' }
      facebook: { type: string, default: si }
      historia: { type: boolean, default: false }
      # Comentario en el issue «Videos para publicar» (llega por correo); los Reels solo de Facebook no lo necesitan
      aviso: { type: boolean, default: true }
      reseed: { type: boolean, default: false }
      # Solo generar el video (sin publicar ni avisar): queda para descargar en «Video del día»
      prueba: { type: boolean, default: false }
      # En qué redes sale (fb, ig, tt, yt separadas por coma), según el plan de cada red en scripts/lib/horario.mjs.
      # Vacío = lo de siempre (facebook/publish deciden)
      redes: { type: string, default: '' }

permissions:
  contents: read
  issues: write # comentario «Videos para publicar»: llega por correo con la descripción

jobs:
  daily:
    runs-on: ubuntu-latest
    # El video largo de YouTube (8 a 10 min, 1080p) y el video 3D (Remotion con la CPU, ~40-55 min) tardan más
    timeout-minutes: ${{ (inputs.cats == 'video3d-render' || inputs.cats == 'idea-render') && 120 || inputs.cats == 'youtube-largo' && 55 || 30 }}
    # Los dos workflows (dibujos y física) comparten el token de TikTok: nunca corren a la vez
    concurrency:
      # Los videos de ideas se renderizan en su propia cola (tardan ~50 min y no deben frenar las publicaciones)
      group: ${{ inputs.cats == 'idea-render' && 'ideas' || 'daily-tiktok' }}
      cancel-in-progress: false
    env:
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      # YouTube: los Reels se suben como Shorts privados (scripts/lib/youtube.mjs; conectar: npm run youtube:connect -- --github)
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      CATS_INPUT: ${{ inputs.cats || 'dibujos' }}
      PRUEBA_INPUT: ${{ inputs.prueba == true && 'si' || '' }}
      LANG_INPUT: ${{ inputs.lang || 'es' }}
      PUBLISH_INPUT: ${{ inputs.publish || 'draft' }}
      PRIVACY_INPUT: ${{ inputs.privacy || 'PUBLIC_TO_EVERYONE' }}
      # Las corridas programadas no tienen inputs: salen sin sonido
      SOUND_INPUT: ${{ inputs.sonido || 'sin' }}
      FIGURA_INPUT: ${{ inputs.figura || '' }}
      # Almacén Blob de Vercel (opcional): enlace directo al MP4 en el resumen y en el aviso de la corrida
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      # Bot de Telegram: el plan y las noticias de la mañana, y los cambios que le mandas (scripts/lib/control.mjs)
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ESTILOS_INPUT: ${{ inputs.estilos || '' }}
      ESTADO_INPUT: ${{ inputs.estado || '' }}
      FACEBOOK_INPUT: ${{ inputs.facebook || 'si' }}
      HISTORIA_INPUT: ${{ inputs.historia && 'si' || '' }}
      REDES_INPUT: ${{ inputs.redes || '' }}
      # Página de Facebook (opcional): Reel publicado con la misma descripción
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      # Fotos y videos reales de Pixabay para los Reels (opcional: sin la clave, fondo de color)
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # npm ci con reintentos: ffmpeg-static baja su binario de GitHub y a veces da 504 (pasó el 9 nov en el render 3D)
      - name: Dependencias
        run: |
          mkdir -p out
          for i in 1 2 3; do npm ci && exit 0; echo "npm ci falló (intento $i), reintento en 30 s"; sleep 30; done
          exit 1

      - name: Fuentes completas de emoji y STIX (en caché)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: assets/fonts
          key: fonts-v2-noto-emoji-stix
      - run: npm run fonts

      # Voz del narrador de los Reels (Kokoro, local y sin API; scripts/lib/voz.mjs). El modelo (≈350 MB) va en caché
      - name: Modelo de voz (en caché)
        if: env.CATS_INPUT == 'curiosidades-video' || env.CATS_INPUT == 'youtube-largo' || env.CATS_INPUT == 'video3d-render' || env.CATS_INPUT == 'idea-render'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/kokoro
          key: voz-kokoro-v1.0
      # Kokoro aún no tiene versión para Python 3.14 (el de ubuntu-latest): se usa 3.12
      - name: Python para la voz
        if: env.CATS_INPUT == 'curiosidades-video' || env.CATS_INPUT == 'youtube-largo' || env.CATS_INPUT == 'video3d-render' || env.CATS_INPUT == 'idea-render'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar la voz
        continue-on-error: true
        if: env.CATS_INPUT == 'curiosidades-video' || env.CATS_INPUT == 'youtube-largo' || env.CATS_INPUT == 'video3d-render' || env.CATS_INPUT == 'idea-render'
        run: |
          python -m venv .tools/voz
          .tools/voz/bin/python -m pip install -q kokoro-onnx==${KOKORO_VERSION}
          mkdir -p .tools/kokoro
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -s ".tools/kokoro/$f" ] || curl -fsSL --retry 3 -o ".tools/kokoro/$f" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f"
          done
        env:
          KOKORO_VERSION: 0.6.1

      # Videos 3D (video3d/: Remotion + Three.js): sus dependencias y el Chrome sin pantalla que dibuja los cuadros
      - name: Motor de video 3D
        if: env.CATS_INPUT == 'video3d-render' || env.CATS_INPUT == 'idea-render'
        working-directory: video3d
        run: |
          for i in 1 2 3; do npm ci && break; [ $i = 3 ] && exit 1; echo "npm ci falló (intento $i), reintento en 30 s"; sleep 30; done
          npx remotion browser ensure

      # Reenvío (republicar.yml): el MP4 que dejó su trabajo «bajar» en esta misma corrida
      - name: Video a reenviar
        if: inputs.cats == 'republicar'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reenvio
          path: reenvio

      # Token de TikTok e historial de figuras, cifrados con STATE_KEY entre corridas
      - name: Recuperar estado
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: state.enc
          key: tiktok-state-${{ github.run_id }}
          restore-keys: tiktok-state-
      # El token guardado gana sobre el secreto, salvo con reseed (después de reconectar: desconectar la cuenta
      # en la web o en TikTok revoca todos sus tokens, también el de aquí). El historial de figuras se conserva.
      - name: Descifrar estado
        env:
          TIKTOK_TOKEN_SEED: ${{ secrets.TIKTOK_TOKEN_SEED }}
          RESEED: ${{ inputs.reseed || false }}
        run: |
          mkdir -p data state-tmp
          if [ -f state.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in state.enc -pass env:STATE_KEY | tar -xz -C state-tmp
            # Solo lo que no está en git (token, historial, pendientes): lo del repo (biblioteca, famosos) manda siempre
            for f in state-tmp/*; do [ -e "$f" ] || continue; n=$(basename "$f"); git ls-files --error-unmatch "data/$n" >/dev/null 2>&1 || cp -r "$f" "data/$n"; done
          fi
          if [ -n "$TIKTOK_TOKEN_SEED" ] && { [ "$RESEED" = "true" ] || [ ! -f data/tiktok-token.json ]; }; then
            printf '%s' "$TIKTOK_TOKEN_SEED" > data/tiktok-token.json
            echo "Token tomado de TIKTOK_TOKEN_SEED"
          fi

      - name: Generar y enviar
        # El render 3D tiene su propio límite: si se pasa, la corrida igual llega al aviso de Telegram
        timeout-minutes: ${{ (env.CATS_INPUT == 'video3d-render' || env.CATS_INPUT == 'idea-render') && 105 || 28 }}
        run: |
          # Redes de esta corrida: con «redes» manda el plan de cada red; sin él, lo de siempre
          en_red() { case ",$REDES_INPUT," in *",$1,"*) echo si ;; *) echo no ;; esac; }
          if [ -n "$REDES_INPUT" ]; then
            R_FB=$(en_red fb); R_IG=$(en_red ig); R_YT=$(en_red yt); R_TT=$( [ "$(en_red tt)" = si ] && echo draft || echo no )
          else
            R_FB="$FACEBOOK_INPUT"; R_IG=si; R_YT=si; R_TT=$( [ "$PUBLISH_INPUT" = draft ] && echo draft || echo no )
          fi
          echo "Redes: fb=$R_FB ig=$R_IG yt=$R_YT tiktok=$R_TT"
          # Imágenes de curiosidades y noticias (curiosidades-facebook.yml y curiosidades-tiktok.yml)
          case "$CATS_INPUT" in
            curiosidades-facebook) node scripts/curiosidades.mjs --red facebook --facebook "$R_FB" --instagram "$R_IG" --tipo "${FIGURA_INPUT:-auto}"; exit 0 ;;
            # TikTok: carrusel de 5 imágenes (retos visuales o datos, día por medio)
            curiosidades-tiktok) node scripts/curiosidades.mjs --red tiktok --carrusel 5; exit 0 ;;
            # Reels de quiz y curiosidades (curiosidades-reels.yml); «figura» elige el formato: top10, quiz o banderas
            # Contestar los comentarios de los retos (comentarios.yml); out/ vacío para los pasos de resumen
            # Reenvío de un video ya generado (republicar.yml: el MP4 llega en reenvio/) y vistas de lo publicado (vistas.yml)
            republicar) node scripts/republicar.mjs --video "$FIGURA_INPUT" --facebook "$R_FB" --instagram "$R_IG" --youtube "$R_YT" --tiktok "$R_TT"; exit 0 ;;
            vistas) mkdir -p out; node scripts/vistas.mjs; exit 0 ;;
            comentarios) mkdir -p out; if [ "$FIGURA_INPUT" = diagnostico ]; then node scripts/comentarios.mjs --diagnostico; else node scripts/comentarios.mjs; fi; exit 0 ;;
            # Noticias del día para los Reels (noticias.yml) y especial GTA VI (gta6.yml; «figura» = lanzamiento en la mañana)
            noticias) mkdir -p out; node scripts/noticias.mjs; exit 0 ;;
            # Metas semanales de Facebook (metas.yml): «figura» = «fotos,historias» puestas desde el panel (vacías = las guardadas)
            metas) mkdir -p out; IFS=, read -r mf mh <<< "$FIGURA_INPUT"; node scripts/metas.mjs ${mf:+--fotos "$mf"} ${mh:+--historias "$mh"}; exit 0 ;;
            gta6) GTA_TT=$( [ -n "$REDES_INPUT" ] && echo "$R_TT" || echo draft ); if [ "$FIGURA_INPUT" = "lanzamiento" ]; then node scripts/gta6.mjs --solo-lanzamiento --facebook "$R_FB" --instagram "$R_IG" --tiktok "$GTA_TT" --youtube "$R_YT"; else node scripts/gta6.mjs --facebook "$R_FB" --instagram "$R_IG" --tiktok "$GTA_TT" --youtube "$R_YT"; fi; exit 0 ;;
            # Videos 3D: el render de la madrugada y la publicación del mediodía (video3d.yml)
            # Videos desde una idea (ideas.yml): «figura» = el id de la idea
            idea-render) node scripts/idea.mjs --render "$FIGURA_INPUT"; exit 0 ;;
            idea-publicar) node scripts/idea.mjs --publicar "$FIGURA_INPUT" --redes "${REDES_INPUT:-fb,ig,tt,yt}"; exit 0 ;;
            video3d-render) node scripts/video3d-render.mjs --turno "${FIGURA_INPUT:-mediodia}" ${PRUEBA_INPUT:+--dry-run}; exit 0 ;;
            video3d-publicar) node scripts/video3d-publicar.mjs --turno "${FIGURA_INPUT:-mediodia}" --tiktok "$( [ "$R_TT" = draft ] && echo si || echo no )" --youtube "$R_YT"; exit 0 ;;
            youtube-largo) if [ "$FIGURA_INPUT" = ysi ]; then node scripts/ysi.mjs ${PRUEBA_INPUT:+--dry-run}; elif [ "$FIGURA_INPUT" = gta ]; then node scripts/gta-largo.mjs ${PRUEBA_INPUT:+--dry-run}; else node scripts/youtube-largo.mjs ${PRUEBA_INPUT:+--dry-run}; fi; exit 0 ;;
            curiosidades-video) node scripts/curiosidades-video.mjs --facebook "$R_FB" --instagram "$R_IG" --youtube "$R_YT" --formato "${FIGURA_INPUT:-auto}" ${HISTORIA_INPUT:+--historia} ${PRUEBA_INPUT:+--dry-run} --tiktok "$R_TT"; exit 0 ;;
          esac
          # Solo consultar el estado de subidas anteriores
          if [ -n "$ESTADO_INPUT" ]; then
            if [ "$ESTADO_INPUT" = "ultimos" ]; then node scripts/tiktok-status.mjs; else node scripts/tiktok-status.mjs $ESTADO_INPUT; fi
            exit 0
          fi
          case "$CATS_INPUT" in
            dibujos) cats=figuras,nombres,combinaciones,inventadas ;;
            fisica) cats=pelotas,juegos ;;
            # Solo los formatos más nuevos (para probarlos a mano)
            nuevos) cats=juegos:paises,juegos:muros,juegos:batalla,pelotas:lineas ;;
            # Solo nombres y parejas (con sus seis estilos)
            nombres) cats=nombres,combinaciones ;;
            # juegos o pelotas: solo esa categoría (útil para lanzar a mano)
            *) cats="$CATS_INPUT" ;;
          esac
          # Una figura concreta (su id de catálogo) manda sobre el tipo de video
          if [ -n "$FIGURA_INPUT" ]; then cats="$FIGURA_INPUT"; fi
          args=(--lang "$LANG_INPUT" --cats "$cats")
          if [ "$SOUND_INPUT" = "sin" ]; then args+=(--mute); fi
          if [ -n "$ESTILOS_INPUT" ]; then args+=(--estilos "$ESTILOS_INPUT"); fi
          args+=(--facebook "$FACEBOOK_INPUT")
          if [ -n "$HISTORIA_INPUT" ]; then args+=(--historia); fi
          if [ "$PUBLISH_INPUT" != "none" ]; then args+=(--publish "$PUBLISH_INPUT" --privacy "$PRIVACY_INPUT"); fi
          npm run daily -- "${args[@]}"

      # Descripción lista para copiar y pegar en TikTok (la API no la acepta en los borradores)
      - name: Descripción para pegar
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            for (const f of fs.readdirSync("out").filter((f) => f.endsWith(".json"))) {
              const m = JSON.parse(fs.readFileSync("out/" + f, "utf8")); if (!m.post) continue;
              const t = (m.tiktok || []).at(-1);
              const lines = ["### Descripción para pegar en TikTok", "", "```", m.post.text, "```", "",
                `Figura: ${m.title}` + (m.duration ? ` · ${Math.round(m.duration)} s` : "") + (t ? ` · TikTok: ${t.status} (${t.mode})` : "")];
              if (t && t.status === "LIMIT") lines.push("", "TikTok no aceptó más borradores por ahora (5 pendientes cada 24 h): descarga el video del artefacto de esta corrida o publica los pendientes.");
              if (m.videoUrl) lines.push("", `**[⬇️ Descargar el video (MP4)](${m.videoDownload || m.videoUrl + "?download=1"})** · [▶️ Verlo](${m.videoUrl})`);
              if (m.imageUrl) lines.push("", `**[🖼️ Ver la imagen](${m.imageUrl})** · [⬇️ Descargarla](${m.imageUrl}?download=1)`);
              if (t && t.account) lines.push("", `Cuenta de TikTok: ${t.account}`);
              if (m.facebook) lines.push("", `Facebook: ${m.facebook.status}` + (m.facebook.permalink ? ` · [${m.imageUrl ? "ver la publicación" : "ver el Reel"}](${m.facebook.permalink})` : "") + (m.facebook.error ? ` · ${m.facebook.error}` : ""));
              if (m.facebookStory) lines.push("", `Historia de Facebook: ${m.facebookStory.status}` + (m.facebookStory.error ? ` · ${m.facebookStory.error}` : ""));
              for (const [k, v] of [["Instagram", m.instagram], ["Historia de Instagram", m.instagramStory]]) if (v) lines.push("", `${k}: ${v.status}` + (v.permalink ? ` · [verla](${v.permalink})` : "") + (v.error ? ` · ${v.error}` : ""));
              if (m.youtube) lines.push("", m.youtube.studio ? `YouTube: subido como privado · [publícalo en Studio](${m.youtube.studio})` : `YouTube: ${m.youtube.error}`);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
              // Aviso de la corrida (se ve arriba en la página de la corrida y en la app de GitHub): descripción y enlace
              const esc = (s) => s.replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A");
              const aviso = [m.post.text, "", `${m.title} · ${t ? t.status : "sin subir"}`, m.videoUrl ? `Descargar: ${m.videoDownload || m.videoUrl + "?download=1"}` : ""].join("\n");
              console.log(`::notice title=Descripción para pegar en TikTok::${esc(aviso)}`);
            }' || true

      # Aviso SOLO si la corrida falló o algo necesita tu intervención (borrador de TikTok, video privado en YouTube),
      # por Telegram o WhatsApp; sin esos secretos, por correo (comentario en el issue «Videos para publicar»).
      # Lo que se publica solo en Facebook e Instagram no avisa
      - name: Aviso de lo que hay que revisar
        if: always() && env.ESTADO_INPUT == '' && env.PRUEBA_INPUT == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_NAME: ${{ github.workflow }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: node scripts/aviso.mjs || echo "No se pudo avisar"

      - name: Cifrar estado
        # El render de ideas corre aparte: no guarda el estado (pisaría lo de las otras corridas)
        if: always() && inputs.cats != 'idea-render'
        run: |
          # Solo los archivos que no están en git (ver «Descifrar estado»)
          files=$(cd data 2>/dev/null && for f in *; do [ -e "$f" ] || continue; git ls-files --error-unmatch "$f" >/dev/null 2>&1 || echo "$f"; done)
          if [ -n "$files" ]; then
            tar -cz -C data $files | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:STATE_KEY -out state.enc
          fi
      - name: Guardar estado
        if: always() && inputs.cats != 'idea-render' && hashFiles('state.enc') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: state.enc
          key: tiktok-state-${{ github.run_id }}

      - name: Video del día
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: video-${{ github.run_id }}
          path: out/
          # 30 días: de aquí se bajan los videos para reenviarlos (republicar.yml). El repo es público: no cuesta
          retention-days: 30
          if-no-files-found: ignore

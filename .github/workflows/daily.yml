# Un video de CirculArte cada 4 horas: elige figura compleja → renderiza en modo suspenso → descripción con plantillas →
# borrador en la bandeja de TikTok (la descripción queda en el resumen de la corrida para pegarla en la app).
# Todo sale del proyecto: sin IA ni APIs de pago.
# Por defecto va en borrador hasta que TikTok audite Direct Post: sin auditoría, publicar directo da
# 403 unaudited_client_can_only_post_to_private_accounts. El usuario quiere pasar a directo y público después
# (cambiar 'draft' por 'direct' en los valores por defecto), sabiendo que las reglas de TikTok no aceptan
# herramientas que suben a las propias cuentas.
# Base de todas las publicaciones: nombres.yml (nombres y parejas con los estilos nuevos), famosos.yml (futbolistas) y
# fisica.yml (pelotas y juegos) lo reutilizan con su propio horario. Este ya no corre solo (las figuras e inventadas
# se dejaron de priorizar el 2026-10-27); se puede lanzar a mano con cualquier tipo de video.
# Secretos necesarios (Settings → Secrets and variables → Actions): ver README, sección «Publicación diaria».
name: Video diario a TikTok

on:
  workflow_dispatch:
    inputs:
      cats:
        description: Qué tipo de video
        type: choice
        options: [dibujos, nombres, famosos, curiosidades-facebook, curiosidades-tiktok, curiosidades-video, fisica, juegos, pelotas, nuevos]
        default: dibujos
      lang:
        description: Idioma del video y la descripción
        type: choice
        options: [es, en]
        default: es
      publish:
        description: Enviar como borrador, publicar directo (requiere auditoría de Direct Post) o solo generar el video
        type: choice
        options: [draft, direct, none]
        default: draft
      privacy:
        description: Privacidad de la publicación directa
        type: choice
        options: [PUBLIC_TO_EVERYONE, MUTUAL_FOLLOW_FRIENDS, SELF_ONLY]
        default: PUBLIC_TO_EVERYONE
      figura:
        description: Una figura concreta por su id (por ejemplo famoso:kane-balondeoro o nombre:Andrea); vacío = al azar
        type: string
        default: ''
      estilos:
        description: Estilos de nombre permitidos, separados por comas (espejo, mandala, hilos, anillos, costura, clasico) o «nuevos»; vacío = todos
        type: string
        default: ''
      facebook:
        description: Publicar también como Reel en la página de Facebook (necesita los secretos FB_PAGE_ID y FB_PAGE_TOKEN)
        type: choice
        options: [si, no, borrador]
        default: si
      historia:
        description: Publicar también el video como historia de la página de Facebook (hasta 60 s)
        type: boolean
        default: false
      aviso:
        description: Comentar en el issue «Videos para publicar» (te llega por correo con la descripción)
        type: boolean
        default: true
      estado:
        description: Solo consultar en TikTok el estado de subidas anteriores (publish_id separados por espacios, o «ultimos»); no genera video
        type: string
        default: ''
      sonido:
        description: Sonido del video (sin = audio en silencio, para ponerle en TikTok una canción del momento)
        type: choice
        options: [sin, con]
        default: sin
      reseed:
        description: Usar el token del secreto TIKTOK_TOKEN_SEED en vez del guardado (tras volver a conectar la cuenta)
        type: boolean
        default: false
  workflow_call:
    inputs:
      cats: { type: string, default: dibujos }
      lang: { type: string, default: es }
      publish: { type: string, default: draft }
      privacy: { type: string, default: PUBLIC_TO_EVERYONE }
      sonido: { type: string, default: sin }
      figura: { type: string, default: '' }
      estilos: { type: string, default: '' }
      estado: { type: string, default: '' }
      facebook: { type: string, default: si }
      historia: { type: boolean, default: false }
      # Comentario en el issue «Videos para publicar» (llega por correo); los Reels solo de Facebook no lo necesitan
      aviso: { type: boolean, default: true }
      reseed: { type: boolean, default: false }

permissions:
  contents: read
  issues: write # comentario «Videos para publicar»: llega por correo con la descripción

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Los dos workflows (dibujos y física) comparten el token de TikTok: nunca corren a la vez
    concurrency:
      group: daily-tiktok
      cancel-in-progress: false
    env:
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      CATS_INPUT: ${{ inputs.cats || 'dibujos' }}
      LANG_INPUT: ${{ inputs.lang || 'es' }}
      PUBLISH_INPUT: ${{ inputs.publish || 'draft' }}
      PRIVACY_INPUT: ${{ inputs.privacy || 'PUBLIC_TO_EVERYONE' }}
      # Las corridas programadas no tienen inputs: salen sin sonido
      SOUND_INPUT: ${{ inputs.sonido || 'sin' }}
      FIGURA_INPUT: ${{ inputs.figura || '' }}
      # Almacén Blob de Vercel (opcional): enlace directo al MP4 en el resumen y en el aviso de la corrida
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      ESTILOS_INPUT: ${{ inputs.estilos || '' }}
      ESTADO_INPUT: ${{ inputs.estado || '' }}
      FACEBOOK_INPUT: ${{ inputs.facebook || 'si' }}
      HISTORIA_INPUT: ${{ inputs.historia && 'si' || '' }}
      # Página de Facebook (opcional): Reel publicado con la misma descripción
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fuentes completas de emoji y STIX (en caché)
        uses: actions/cache@v4
        with:
          path: assets/fonts
          key: fonts-v2-noto-emoji-stix
      - run: npm run fonts

      # Token de TikTok e historial de figuras, cifrados con STATE_KEY entre corridas
      - name: Recuperar estado
        uses: actions/cache/restore@v4
        with:
          path: state.enc
          key: tiktok-state-${{ github.run_id }}
          restore-keys: tiktok-state-
      # El token guardado gana sobre el secreto, salvo con reseed (después de reconectar: desconectar la cuenta
      # en la web o en TikTok revoca todos sus tokens, también el de aquí). El historial de figuras se conserva.
      - name: Descifrar estado
        env:
          TIKTOK_TOKEN_SEED: ${{ secrets.TIKTOK_TOKEN_SEED }}
          RESEED: ${{ inputs.reseed || false }}
        run: |
          mkdir -p data state-tmp
          if [ -f state.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in state.enc -pass env:STATE_KEY | tar -xz -C state-tmp
            # Solo lo que no está en git (token, historial, pendientes): lo del repo (biblioteca, famosos) manda siempre
            for f in state-tmp/*; do [ -e "$f" ] || continue; n=$(basename "$f"); git ls-files --error-unmatch "data/$n" >/dev/null 2>&1 || cp -r "$f" "data/$n"; done
          fi
          if [ -n "$TIKTOK_TOKEN_SEED" ] && { [ "$RESEED" = "true" ] || [ ! -f data/tiktok-token.json ]; }; then
            printf '%s' "$TIKTOK_TOKEN_SEED" > data/tiktok-token.json
            echo "Token tomado de TIKTOK_TOKEN_SEED"
          fi

      - name: Generar y enviar
        run: |
          # Imágenes de curiosidades y noticias (curiosidades-facebook.yml y curiosidades-tiktok.yml)
          case "$CATS_INPUT" in
            curiosidades-facebook) node scripts/curiosidades.mjs --red facebook; exit 0 ;;
            curiosidades-tiktok) node scripts/curiosidades.mjs --red tiktok; exit 0 ;;
            # Reels de quiz y curiosidades (curiosidades-reels.yml); «figura» elige el formato: top10, quiz o banderas
            curiosidades-video) node scripts/curiosidades-video.mjs --facebook "$FACEBOOK_INPUT" --formato "${FIGURA_INPUT:-auto}" ${HISTORIA_INPUT:+--historia}; exit 0 ;;
          esac
          # Solo consultar el estado de subidas anteriores
          if [ -n "$ESTADO_INPUT" ]; then
            if [ "$ESTADO_INPUT" = "ultimos" ]; then node scripts/tiktok-status.mjs; else node scripts/tiktok-status.mjs $ESTADO_INPUT; fi
            exit 0
          fi
          case "$CATS_INPUT" in
            dibujos) cats=figuras,nombres,combinaciones,inventadas ;;
            fisica) cats=pelotas,juegos ;;
            # Solo los formatos más nuevos (para probarlos a mano)
            nuevos) cats=juegos:paises,juegos:muros,juegos:batalla,pelotas:lineas ;;
            # Solo nombres y parejas (con sus seis estilos)
            nombres) cats=nombres,combinaciones ;;
            # juegos o pelotas: solo esa categoría (útil para lanzar a mano)
            *) cats="$CATS_INPUT" ;;
          esac
          # Una figura concreta (su id de catálogo) manda sobre el tipo de video
          if [ -n "$FIGURA_INPUT" ]; then cats="$FIGURA_INPUT"; fi
          args=(--lang "$LANG_INPUT" --cats "$cats")
          if [ "$SOUND_INPUT" = "sin" ]; then args+=(--mute); fi
          if [ -n "$ESTILOS_INPUT" ]; then args+=(--estilos "$ESTILOS_INPUT"); fi
          args+=(--facebook "$FACEBOOK_INPUT")
          if [ -n "$HISTORIA_INPUT" ]; then args+=(--historia); fi
          if [ "$PUBLISH_INPUT" != "none" ]; then args+=(--publish "$PUBLISH_INPUT" --privacy "$PRIVACY_INPUT"); fi
          npm run daily -- "${args[@]}"

      # Descripción lista para copiar y pegar en TikTok (la API no la acepta en los borradores)
      - name: Descripción para pegar
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            for (const f of fs.readdirSync("out").filter((f) => f.endsWith(".json"))) {
              const m = JSON.parse(fs.readFileSync("out/" + f, "utf8")); if (!m.post) continue;
              const t = (m.tiktok || []).at(-1);
              const lines = ["### Descripción para pegar en TikTok", "", "```", m.post.text, "```", "",
                `Figura: ${m.title}` + (m.duration ? ` · ${Math.round(m.duration)} s` : "") + (t ? ` · TikTok: ${t.status} (${t.mode})` : "")];
              if (t && t.status === "LIMIT") lines.push("", "TikTok no aceptó más borradores por ahora (5 pendientes cada 24 h): descarga el video del artefacto de esta corrida o publica los pendientes.");
              if (m.videoUrl) lines.push("", `**[⬇️ Descargar el video (MP4)](${m.videoDownload || m.videoUrl + "?download=1"})** · [▶️ Verlo](${m.videoUrl})`);
              if (m.imageUrl) lines.push("", `**[🖼️ Ver la imagen](${m.imageUrl})** · [⬇️ Descargarla](${m.imageUrl}?download=1)`);
              if (t && t.account) lines.push("", `Cuenta de TikTok: ${t.account}`);
              if (m.facebook) lines.push("", `Facebook: ${m.facebook.status}` + (m.facebook.permalink ? ` · [${m.imageUrl ? "ver la publicación" : "ver el Reel"}](${m.facebook.permalink})` : "") + (m.facebook.error ? ` · ${m.facebook.error}` : ""));
              if (m.facebookStory) lines.push("", `Historia de Facebook: ${m.facebookStory.status}` + (m.facebookStory.error ? ` · ${m.facebookStory.error}` : ""));
              for (const [k, v] of [["Instagram", m.instagram], ["Historia de Instagram", m.instagramStory]]) if (v) lines.push("", `${k}: ${v.status}` + (v.permalink ? ` · [verla](${v.permalink})` : "") + (v.error ? ` · ${v.error}` : ""));
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
              // Aviso de la corrida (se ve arriba en la página de la corrida y en la app de GitHub): descripción y enlace
              const esc = (s) => s.replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A");
              const aviso = [m.post.text, "", `${m.title} · ${t ? t.status : "sin subir"}`, m.videoUrl ? `Descargar: ${m.videoDownload || m.videoUrl + "?download=1"}` : ""].join("\n");
              console.log(`::notice title=Descripción para pegar en TikTok::${esc(aviso)}`);
            }' || true

      # Aviso por correo: un comentario en el issue «Videos para publicar» con la descripción y el enlace. GitHub manda
      # cada comentario por correo (y a la app) con el texto completo, cosa que no hace con el correo de la corrida.
      - name: Aviso por correo con la descripción
        if: always() && env.ESTADO_INPUT == '' && inputs.aviso != false
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e '
            const fs = require("fs"); if (!fs.existsSync("out")) process.exit(0);
            const parts = [];
            for (const f of fs.readdirSync("out").filter((f) => f.endsWith(".json"))) {
              const m = JSON.parse(fs.readFileSync("out/" + f, "utf8")); if (!m.post) continue;
              const t = (m.tiktok || []).at(-1), st = t ? t.status : "sin subir";
              const nota = st === "LIMIT" ? "\n\n⚠️ TikTok no lo aceptó (5 borradores pendientes): bájalo y súbelo a mano." : st === "SEND_TO_USER_INBOX" ? "\n\nEnviado a la bandeja de TikTok (aviso «Tu contenido de Circularte está listo»)." : "";
              const fbl = m.facebook ? `\n\nFacebook: ${m.facebook.status}` + (m.facebook.permalink ? ` · [${m.imageUrl ? "ver la publicación" : "ver el Reel"}](${m.facebook.permalink})` : "") + (m.facebook.error ? ` (${m.facebook.error})` : "") : "";
              parts.push(`### 🎬 ${m.title} · ${st}\n\n\`\`\`\n${m.post.text}\n\`\`\`\n\n` + (m.videoUrl ? `[⬇️ Descargar el video](${m.videoDownload || m.videoUrl + "?download=1"}) · [▶️ Verlo](${m.videoUrl}) · ` : "") + (m.imageUrl ? `[🖼️ Ver la imagen](${m.imageUrl}) · ` : "") + `[Ver la corrida](${process.env.RUN_URL})` + nota + fbl);
            }
            if (parts.length) fs.writeFileSync("aviso.md", parts.join("\n\n---\n\n") + "\n");' || true
          [ -f aviso.md ] || exit 0
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Videos para publicar in:title" --json number --jq '.[0].number // empty')
          if [ -z "$n" ]; then
            n=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "Videos para publicar" --body "@${{ github.repository_owner }} cada corrida deja aquí la descripción para pegar en TikTok y el enlace al video. Te llega por correo con cada comentario." | grep -o '[0-9]*$')
          fi
          gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file aviso.md || echo "No se pudo comentar en el issue"

      # Aviso por WhatsApp (CallMeBot, gratis): solo si están los secretos CALLMEBOT_PHONE y CALLMEBOT_APIKEY
      - name: Aviso por WhatsApp
        if: always()
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$CALLMEBOT_PHONE" ] || [ -z "$CALLMEBOT_APIKEY" ]; then echo "Sin secretos de CallMeBot: no se avisa"; exit 0; fi
          node -e '
            const fs = require("fs");
            const files = fs.existsSync("out") ? fs.readdirSync("out").filter((f) => f.endsWith(".json")) : [];
            const m = files.length ? JSON.parse(fs.readFileSync("out/" + files[0], "utf8")) : null;
            const t = m && (m.tiktok || []).at(-1);
            const estado = !m ? "❌ La corrida falló antes de hacer el video" : !t ? "🎬 Video generado (sin subir)"
              : t.status === "SEND_TO_USER_INBOX" ? "✅ Borrador listo en tu bandeja de TikTok"
              : t.status === "LIMIT" ? "⚠️ TikTok no aceptó más borradores: descárgalo del enlace" : `TikTok: ${t.status}`;
            const msg = [`CirculArte · ${estado}`, m ? `${m.title} · ${Math.round(m.duration)} s` : `Estado: ${process.env.JOB_STATUS}`,
              m && m.post ? `\nDescripción para pegar:\n${m.post.text}` : "", `\nRevisar: ${process.env.RUN_URL}`].join("\n");
            fs.writeFileSync("whatsapp.txt", msg);'
          curl -sS -G "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=$CALLMEBOT_PHONE" --data-urlencode "text@whatsapp.txt" --data-urlencode "apikey=$CALLMEBOT_APIKEY" \
            -o /dev/null -w "CallMeBot respondió %{http_code}\n" || echo "No se pudo avisar por WhatsApp"

      - name: Cifrar estado
        if: always()
        run: |
          # Solo los archivos que no están en git (ver «Descifrar estado»)
          files=$(cd data 2>/dev/null && for f in *; do [ -e "$f" ] || continue; git ls-files --error-unmatch "$f" >/dev/null 2>&1 || echo "$f"; done)
          if [ -n "$files" ]; then
            tar -cz -C data $files | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:STATE_KEY -out state.enc
          fi
      - name: Guardar estado
        if: always() && hashFiles('state.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: state.enc
          key: tiktok-state-${{ github.run_id }}

      - name: Video del día
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

# Un video diario de CirculArte: elige figura compleja → renderiza en modo suspenso → descripción con plantillas →
# publicación directa y pública en TikTok, con descripción. Todo sale del proyecto: sin IA ni APIs de pago.
# Ojo: las reglas de TikTok para desarrolladores no aceptan herramientas que suben a las propias cuentas; el
# usuario decidió publicar directo igual (24-10-2026). Para volver a borradores: publish = draft.
# Secretos necesarios (Settings → Secrets and variables → Actions): ver README, sección «Publicación diaria».
name: Video diario a TikTok

on:
  schedule:
    - cron: '0 16 * * *' # 10:00 en Honduras (UTC-6)
  workflow_dispatch:
    inputs:
      lang:
        description: Idioma del video y la descripción
        type: choice
        options: [es, en]
        default: es
      publish:
        description: Publicar directo, enviar como borrador o solo generar el video
        type: choice
        options: [direct, draft, none]
        default: direct
      privacy:
        description: Privacidad de la publicación directa
        type: choice
        options: [PUBLIC_TO_EVERYONE, MUTUAL_FOLLOW_FRIENDS, SELF_ONLY]
        default: PUBLIC_TO_EVERYONE

permissions:
  contents: read

concurrency:
  group: daily-tiktok
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      LANG_INPUT: ${{ inputs.lang || 'es' }}
      PUBLISH_INPUT: ${{ inputs.publish || 'direct' }}
      PRIVACY_INPUT: ${{ inputs.privacy || 'PUBLIC_TO_EVERYONE' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fuente de emoji (en caché)
        uses: actions/cache@v4
        with:
          path: assets/fonts
          key: noto-color-emoji-v1
      - run: npm run fonts

      # Token de TikTok e historial de figuras, cifrados con STATE_KEY entre corridas
      - name: Recuperar estado
        uses: actions/cache/restore@v4
        with:
          path: state.enc
          key: tiktok-state-${{ github.run_id }}
          restore-keys: tiktok-state-
      - name: Descifrar estado
        env:
          TIKTOK_TOKEN_SEED: ${{ secrets.TIKTOK_TOKEN_SEED }}
        run: |
          mkdir -p data
          if [ -f state.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in state.enc -pass env:STATE_KEY | tar -xz -C data
          elif [ -n "$TIKTOK_TOKEN_SEED" ]; then
            printf '%s' "$TIKTOK_TOKEN_SEED" > data/tiktok-token.json
          fi

      - name: Generar y enviar
        run: |
          args=(--lang "$LANG_INPUT")
          if [ "$PUBLISH_INPUT" != "none" ]; then args+=(--publish "$PUBLISH_INPUT" --privacy "$PRIVACY_INPUT"); fi
          npm run daily -- "${args[@]}"

      - name: Cifrar estado
        if: always()
        run: |
          if [ -d data ] && [ -n "$(ls -A data)" ]; then
            tar -cz -C data . | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:STATE_KEY -out state.enc
          fi
      - name: Guardar estado
        if: always() && hashFiles('state.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: state.enc
          key: tiktok-state-${{ github.run_id }}

      - name: Video del día
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

# Especial GTA VI (scripts/gta6.mjs): un Reel diario «Faltan N días» con curiosidades confirmadas hasta el lanzamiento
# (19 de noviembre de 2026) y, ese día, un especial con lo que hay que saber para jugar. Facebook e Instagram (Reel +
# historia) y TikTok (borrador sin sonido: ocupa el lugar de un nombre en los 5 borradores diarios).
# Después del lanzamiento el script no publica nada: se puede desactivar el workflow.
name: Especial GTA VI

on:
  # Horario: lo lanza el relojero (/api/relojero, llamado por cron-job.org cada 10 min) según scripts/lib/horario.mjs.
  # Los «schedule» de GitHub se perdían o llegaban con horas de atraso (2026-11-01).
  workflow_dispatch:
    inputs:
      redes:
        description: Redes (fb,ig,tt,yt); vacío = lo de siempre. Lo pone el plan de cada red (scripts/lib/horario.mjs)
        type: string
        default: ''
      lanzamiento:
        description: Corrida de la mañana del lanzamiento (solo publica el día del lanzamiento)
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  gta6:
    uses: ./.github/workflows/daily.yml
    with:
      cats: gta6
      redes: ${{ inputs.redes }}
      figura: ${{ inputs.lanzamiento && 'lanzamiento' || '' }}
      publish: none
      # Va a TikTok: el correo trae la descripción para pegarla
      aviso: true
    secrets: inherit

# Futbolistas dibujados con círculos: caras, celebraciones, goles icónicos y escudos (data/famosos.json, siluetas en
# assets/famosos/). Reutiliza daily.yml con cats = famosos: mismo token, mismo historial y nunca corre a la vez que
# los dibujos. Sin sonido salvo que al lanzarlo a mano elijas «con».
# Ojo: con los nombres (6 al día) son 12 borradores diarios y TikTok admite 5 pendientes cada 24 h por cuenta; los
# que sobren quedan como artefacto de la corrida (sin fallar) hasta que se publiquen los pendientes.
name: Futbolistas a TikTok

on:
  schedule:
    # Cada 4 horas, media hora después de los nombres: en Honduras (UTC-6) 18:47, 22:47, 2:47, 6:47, 10:47 y 14:47
    - cron: '47 */4 * * *'
  workflow_dispatch:
    inputs:
      lang:
        description: Idioma del video y la descripción
        type: choice
        options: [es, en]
        default: es
      publish:
        description: Enviar como borrador, publicar directo (requiere auditoría de Direct Post) o solo generar el video
        type: choice
        options: [draft, direct, none]
        default: draft
      sonido:
        description: Sonido del video (los dibujos con círculos no tienen notas; sin = audio en silencio)
        type: choice
        options: [sin, con]
        default: sin

permissions:
  contents: read

jobs:
  famosos:
    uses: ./.github/workflows/daily.yml
    with:
      cats: famosos
      lang: ${{ inputs.lang || 'es' }}
      publish: ${{ inputs.publish || 'draft' }}
      sonido: ${{ inputs.sonido || 'sin' }}
    secrets: inherit

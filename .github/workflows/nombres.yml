# Nombres y parejas con los estilos nuevos (espejo, mandala, hilos, anillos y costura; las parejas en anillos o
# costura), 3 al día. Reutiliza daily.yml: mismo token, mismo historial y nunca corre a la vez que los futbolistas.
# Sin sonido salvo que al lanzarlo a mano elijas «con».
# TikTok admite 5 borradores pendientes cada 24 h por cuenta (error spam_risk_too_many_pending_share) y los cuentan
# también las fotos de curiosidades: 2 nombres + 1 futbolista + 2 curiosidades = 5. Por eso la corrida de las 19:17
# va solo a Facebook (Reel con sonido). Si un aviso no llega, ese borrador igual cuenta hasta 24 h.
name: Nombres a TikTok

on:
  schedule:
    # Minuto 17 (GitHub retrasa más las horas en punto). En Honduras (UTC-6): 7:17 y 13:17 a TikTok y Facebook
    - cron: '17 13,19 * * *'
    # 19:17 solo a Facebook (el mismo texto se compara abajo)
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      lang:
        description: Idioma del video y la descripción
        type: choice
        options: [es, en]
        default: es
      publish:
        description: Enviar como borrador, publicar directo (requiere auditoría de Direct Post) o solo generar el video
        type: choice
        options: [draft, direct, none]
        default: draft
      sonido:
        description: Sonido del video (sin = audio en silencio, para ponerle en TikTok una canción del momento)
        type: choice
        options: [sin, con]
        default: sin

permissions:
  contents: read
  issues: write

jobs:
  nombres:
    uses: ./.github/workflows/daily.yml
    with:
      cats: nombres
      estilos: nuevos
      lang: ${{ inputs.lang || 'es' }}
      publish: ${{ inputs.publish || (github.event.schedule == '17 1 * * *' && 'none' || 'draft') }}
      sonido: ${{ inputs.sonido || (github.event.schedule == '17 1 * * *' && 'con' || 'sin') }}
    secrets: inherit

# Nombres y parejas con los estilos nuevos (espejo, mandala, hilos, anillos y costura; las parejas en anillos o
# costura), 3 al día. Reutiliza daily.yml: mismo token, mismo historial y nunca corre a la vez que los futbolistas.
# Sin sonido salvo que al lanzarlo a mano elijas «con».
# TikTok admite 5 borradores pendientes cada 24 h por cuenta (error spam_risk_too_many_pending_share) y los cuentan
# también las fotos de curiosidades: 2 nombres + 1 futbolista + 2 curiosidades = 5. Si un aviso no llega, ese
# borrador igual cuenta hasta 24 h. Solo TikTok: en Facebook e Instagram los nombres casi no tuvieron interacción
# (informe del 2026-11-01).
name: Nombres a TikTok

on:
  # Horario: lo lanza el relojero (/api/relojero, llamado por cron-job.org cada 10 min) según scripts/lib/horario.mjs.
  # Los «schedule» de GitHub se perdían o llegaban con horas de atraso (2026-11-01).
  workflow_dispatch:
    inputs:
      lang:
        description: Idioma del video y la descripción
        type: choice
        options: [es, en]
        default: es
      publish:
        description: Enviar como borrador, publicar directo (requiere auditoría de Direct Post) o solo generar el video
        type: choice
        options: [draft, direct, none]
        default: draft
      sonido:
        description: Sonido del video (sin = audio en silencio, para ponerle en TikTok una canción del momento)
        type: choice
        options: [sin, con]
        default: sin

permissions:
  contents: read
  issues: write

jobs:
  nombres:
    uses: ./.github/workflows/daily.yml
    with:
      cats: nombres
      estilos: nuevos
      lang: ${{ inputs.lang || 'es' }}
      publish: ${{ inputs.publish || 'draft' }}
      sonido: ${{ inputs.sonido || 'sin' }}
      facebook: 'no'
    secrets: inherit

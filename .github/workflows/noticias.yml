# Junta las noticias del día (scripts/noticias.mjs: videojuegos, fútbol y ciencia de RSS en español) y las deja en el
# estado cifrado para los Reels «Noticias de hoy» de las 7:57 y las 18:57. No publica nada.
name: Noticias del día

on:
  # Horario: lo lanza el relojero (/api/relojero, llamado por cron-job.org cada 10 min) según scripts/lib/horario.mjs.
  # Los «schedule» de GitHub se perdían o llegaban con horas de atraso (2026-11-01).
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  noticias:
    uses: ./.github/workflows/daily.yml
    with:
      cats: noticias
      publish: none
      aviso: false
    secrets: inherit

# Contesta los comentarios de los retos y quiz de Facebook e Instagram (scripts/comentarios.mjs): «¡Correcto! ✅» a
# quien acierta, un ánimo a quien falla y el puntaje en los quiz en video. Máximo 25 respuestas por corrida.
# Reutiliza daily.yml por el estado cifrado: ahí están las respuestas correctas (data/respuestas.json) y los
# comentarios ya vistos (data/comentarios-respondidos.json). Nunca corre a la vez que las publicaciones.
name: Respuestas a comentarios

on:
  # Horario: lo lanza el relojero (/api/relojero, llamado por cron-job.org cada 10 min) según scripts/lib/horario.mjs.
  # Los «schedule» de GitHub se perdían o llegaban con horas de atraso (2026-11-01).
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  comentarios:
    uses: ./.github/workflows/daily.yml
    with:
      cats: comentarios
      publish: none
      aviso: false
    secrets: inherit

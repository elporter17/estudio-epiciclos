# Informe de rendimiento de Facebook e Instagram (scripts/estadisticas.mjs): vistas, reacciones, comentarios y
# compartidos por formato y por hora. Solo a mano; el informe queda en el resumen de la corrida.
name: Estadísticas de Facebook e Instagram

on:
  workflow_dispatch:
    inputs:
      dias:
        description: Cuántos días hacia atrás
        type: string
        default: '7'

permissions:
  contents: read

jobs:
  informe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Informe
        # El valor llega por variable de entorno (no dentro del comando): así no se puede inyectar nada
        env:
          DIAS: ${{ inputs.dias || '7' }}
        run: node scripts/estadisticas.mjs --dias "$DIAS" --json estadisticas.json | tee -a "$GITHUB_STEP_SUMMARY"
      # El tablero local (npm run tablero) descarga este archivo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: estadisticas
          path: estadisticas.json
          retention-days: 90
